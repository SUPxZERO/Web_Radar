version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Mount current directory to /app for HMR
      - .:/app
      # Anonymous volume ensures container's node_modules is not overwritten by the host
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
